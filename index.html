<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anasjam · Comisiones de ports Source y VRM</title>
<meta name="description" content="Ports de modelos para Garry's Mod, Source Filmmaker y Left 4 Dead 2, y port a VRM. Comisiones por Discord.">
<meta name="theme-color" content="#22407a">
<link rel="icon" href="assets/95c38237cc0ae6e6d6657eb5a082b51a.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#f4f9ff;font-family:'Nunito',system-ui,sans-serif;color:#1c2e50}
a{color:#1c2e50;text-decoration:none}
a:hover{color:#2f6fb5}
.btn{transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.08);color:#ffffff;transform:translateY(-1px)}
.btn2:hover{border-color:#2f6fb5;color:#2f6fb5}
.pay{transition:transform .15s ease,border-color .15s ease}
.pay:hover{border-color:#2f6fb5;transform:translateY(-1px)}
.lang:hover{border-color:#2f6fb5}
.ghost:hover{border-color:#2f6fb5;color:#2f6fb5}
.arrow:hover{background:#ffffff;border-color:#2f6fb5}
.work{transition:transform .2s ease}
.work:hover{transform:translateY(-3px)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion: reduce){.btn,.pay,.work{transition:none}.btn:hover,.pay:hover,.work:hover{transform:none}}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">Esta página necesita JavaScript activado. / This page needs JavaScript enabled.</p></noscript>
<template id="tpl">

<div style="--accent: {{accent}}; --on-accent: #ffffff; --bg: #f4f9ff; --card: #ffffff; --panel: #eaf3fd; --frame: #e3eefa; --line: #d3e3f5; --line2: #b4cde8; --text: #1c2e50; --muted: #526888; --navy: #22407a; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center">

<!-- CINTA MARINERA -->
<div aria-hidden="true" style="width: 100%; height: 11px; background: linear-gradient(to bottom, #22407a 0 4px, #f4f9ff 4px 7px, #4a86c5 7px 11px)"></div>

<div style="width: 100%; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, #d6e8fb 0%, #e9f3ff 60%, #f4f9ff 100%)">
<!-- NAV -->
<header style="width: 100%; max-width: 1200px; box-sizing: border-box; padding: 24px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#inicio" style="display: inline-flex; align-items: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: var(--navy)"><img src="assets/95c38237cc0ae6e6d6657eb5a082b51a.webp" alt="" style="width: 46px; height: auto; display: block">Anasjam</a>
<nav style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; font-size: 15px">
<a href="#servicios" style="padding: 12px 0">{{t.navServices}}</a>
<a href="#trabajos" style="padding: 12px 0">{{t.navWorks}}</a>
<a href="#proceso" style="padding: 12px 0">{{t.navProcess}}</a>
<a href="#preguntas" style="padding: 12px 0">{{t.navFaq}}</a>
<button class="lang" onClick="{{toggleLang}}" aria-label="{{t.toggleAria}}" style="min-height: 44px; min-width: 52px; box-sizing: border-box; padding: 0 14px; background: transparent; color: var(--text); border: 1px solid var(--line2); border-radius: 12px; font-family: 'Nunito', system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">{{t.toggleLabel}}</button>
<a class="btn" href="{{discordUrl}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 20px; background: var(--accent); color: var(--on-accent); font-weight: 600; border-radius: 12px">Discord</a>
</nav>
</header>

<!-- HERO -->
<section id="inicio" style="width: 100%; max-width: 1200px; box-sizing: border-box; padding: 72px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent)">{{t.heroEyebrow}}</p>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 60px; line-height: 1.04; letter-spacing: -0.02em">{{t.heroTitle}}</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: var(--muted); max-width: 520px">{{t.heroSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<a class="btn" href="{{discordUrl}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; box-sizing: border-box; padding: 0 28px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px; border-radius: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
{{t.heroCta}}</a>
<a class="btn2" href="#servicios" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; box-sizing: border-box; padding: 0 28px; border: 1px solid var(--line2); border-radius: 14px; font-weight: 500; font-size: 17px">{{t.heroCta2}}</a>
</div>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; justify-content: center">
<div style="position: relative; width: 100%; max-width: 440px; aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 50%; border: 8px solid #ffffff; background: radial-gradient(circle at 50% 30%, #ffffff 0%, #cfe3f8 100%); box-shadow: 0 18px 40px rgba(34,64,122,0.18); overflow: hidden">
<img src="assets/48ee9326b0807d425618e2e3ee3a5186.webp" alt="{{t.altSailor}}" style="position: absolute; left: 22%; bottom: 0; width: 56%; height: auto; display: block">
</div>
</div>
</section>
<svg viewBox="0 0 1440 56" preserveAspectRatio="none" aria-hidden="true" style="display: block; width: 100%; height: 56px"><path d="M0 28 C 180 56 360 0 540 24 C 720 48 900 4 1080 26 C 1260 48 1350 12 1440 28 L1440 56 L0 56 Z" fill="#f4f9ff"/></svg>
</div>

<!-- SERVICIOS -->
<section id="servicios" style="width: 100%; max-width: 1200px; box-sizing: border-box; padding: 72px 24px; display: flex; flex-direction: column; gap: 40px; border-top: 1px solid var(--line)">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.01em">{{t.servicesTitle}}</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 620px">{{t.servicesSub}}</p>
</div>
<img src="assets/2057bf3a0fa147d87759e09962711c99.webp" alt="{{t.altSailorUp}}" style="width: 130px; height: auto; display: block">
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px">
<sc-for list="{{ services }}" as="s" hint-placeholder-count="4">
<article style="flex: 1 1 260px; min-width: 0; box-sizing: border-box; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 8px 22px rgba(47,111,181,0.10); padding: 28px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent)">{{s.kicker}}</p>
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px">{{s.title}}</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted)">{{s.desc}}</p>
<div style="margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
<p style="margin: 0; font-size: 16px; font-weight: 600">{{s.price}}</p>
<sc-if value="{{ s.hasDetails }}" hint-placeholder-val="{{ false }}">
<button class="ghost" onClick="{{ s.toggle }}" aria-expanded="{{ s.expanded }}" aria-controls="{{ s.controls }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 18px; background: transparent; color: var(--text); border: 1px solid var(--line2); border-radius: 14px; font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">
{{s.detailsLabel}}
<sc-if value="{{ s.collapsed }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></sc-if>
<sc-if value="{{ s.expanded }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></sc-if>
</button>
</sc-if>
</div>
</article>
</sc-for>
</div>

<!-- DETALLES L4D2 -->
<sc-if value="{{ l4d2Open }}" hint-placeholder-val="{{ false }}">
<div id="l4d2-details" style="box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 40px 32px; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent)">Left 4 Dead 2</p>
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.01em">{{t.l4d2Title}}</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 640px">{{t.l4d2Sub}}</p>
</div>

<!-- L4D2 basico -->
<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 40px; border-top: 1px solid var(--line)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: var(--accent)">{{l4a.price}}</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">{{l4a.label}}</p>
<h4 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">{{l4a.tag}}</h4>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">{{l4a.lead}}</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ l4a.items }}" as="it" hint-placeholder-count="2">
<li style="display: flex; align-items: flex-start; gap: 12px; font-size: 16px; line-height: 1.5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f6fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span>{{it.text}}</span>
</li>
</sc-for>
</ul>
</div>
</div>

<!-- L4D2 complejo -->
<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 40px; border-top: 1px solid var(--line)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: var(--accent)">{{l4b.price}}</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">{{l4b.label}}</p>
<h4 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">{{l4b.tag}}</h4>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">{{l4b.lead}}</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ l4b.items }}" as="it" hint-placeholder-count="2">
<li style="display: flex; align-items: flex-start; gap: 12px; font-size: 16px; line-height: 1.5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f6fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span>{{it.text}}</span>
</li>
</sc-for>
</ul>
</div>
</div>

<!-- L4D2 ejemplo -->
<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 40px; border-top: 1px solid var(--line)">
<p style="margin: 0; font-size: 18px; font-weight: 600">{{t.exLabelL4d2}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; box-sizing: border-box; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px">
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h5 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">{{ex10.title}}</h5>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted)">{{ex10.desc}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px">
<button disabled aria-disabled="true" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; box-sizing: border-box; padding: 0 22px; background: var(--line); color: var(--muted); font-family: 'Nunito', system-ui, sans-serif; font-weight: 600; font-size: 16px; border: 1px solid var(--line2); border-radius: 14px; cursor: not-allowed">
<img src="assets/dc5ea2e2627d781afd902f8788344da2.webp" alt="" style="width: 26px; height: 26px; border-radius: 50%; display: block; flex: none; filter: grayscale(1); opacity: 0.55">
{{ex10.btn}}</button>
</div>
</div>
<div style="flex: 2 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; width: 100%; aspect-ratio: 16 / 9; box-sizing: border-box; background: var(--frame); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">
<sc-if value="{{ sl10.s0 }}" hint-placeholder-val="{{ true }}"><img src="assets/eb16a1f67672739ede6c41eb6e6bd4ce.webp" alt="{{t.altL4d2}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; display: block"></sc-if>
<sc-if value="{{ sl10.s1 }}" hint-placeholder-val="{{ false }}"><img src="assets/3fcbe4d2a2cd76f1f41bc0a8eba66396.webp" alt="{{t.altL4d2}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; display: block"></sc-if>
<sc-if value="{{ sl10.s2 }}" hint-placeholder-val="{{ false }}"><img src="assets/cea48cadb4a4811f14f5ac8949d017e3.webp" alt="{{t.altL4d2}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; display: block"></sc-if>
<button class="arrow" onClick="{{ sl10.prev }}" aria-label="{{t.prev}}" style="position: absolute; left: 12px; top: 50%; margin-top: -24px; width: 48px; height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: rgba(255,255,255,0.92); border: 1px solid #b4cde8; border-radius: 50%; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c2e50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="arrow" onClick="{{ sl10.next }}" aria-label="{{t.next}}" style="position: absolute; right: 12px; top: 50%; margin-top: -24px; width: 48px; height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0; background: rgba(255,255,255,0.92); border: 1px solid #b4cde8; border-radius: 50%; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1c2e50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{ sl10.dots }}" as="d" hint-placeholder-count="3"><span style="display: block; width: 8px; height: 8px; border-radius: 50%; background: {{d.bg}}"></span></sc-for>
</div>
<span aria-live="polite" style="font-size: 14px; color: var(--muted)">{{sl10.counter}}</span>
</div>
</div>
</div>
</div>

<!-- L4D2 cierre -->
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding-top: 32px; border-top: 1px solid var(--line)">
<p style="margin: 0; font-size: 15px; color: var(--muted)">{{t.gmodPay}}</p>
<a class="btn" href="{{discordUrl}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 0 26px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px; border-radius: 14px">{{t.packCta}}</a>
</div>

</div>
</sc-if>

<!-- DETALLES VRM -->
<sc-if value="{{ vrmOpen }}" hint-placeholder-val="{{ false }}">
<div id="vrm-details" style="box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 40px 32px; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent)">VRM</p>
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.01em">{{t.vrmTitle}}</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 640px">{{t.vrmSub}}</p>
</div>

<!-- VRM paquete -->

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: var(--accent)">{{vrmp.price}}</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">{{vrmp.label}}</p>
<h4 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">{{vrmp.tag}}</h4>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">{{vrmp.lead}}</p>

</div>

<p style="margin: 0; font-size: 18px; font-weight: 600">{{t.exLabelVrm}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; box-sizing: border-box; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px">
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h5 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px">{{ex12.title}}</h5>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted)">{{ex12.desc}}</p>
</div>
<div style="flex: 2 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; width: 100%; aspect-ratio: 16 / 9; box-sizing: border-box; background: var(--frame); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">

    var m = ONE.exec(str);

      var list = evalHole(node.getAttribute('list') || '', scope) || [];
      var as = node.getAttribute('as');
      for (var i = 0; i < list.length; i++) {
        var sc = Object.create(scope); sc[as] = list[i];
        kids(node, sc, out);
      }
      return;
    }
    var el = node.cloneNode(false);
    var attrs = Array.prototype.slice.call(node.attributes);
    for (var a = 0; a < attrs.length; a++) {
      var name = attrs[a].name, val = attrs[a].value;
      if (name.indexOf('hint-') === 0) { el.removeAttribute(name); continue; }
      if (val.indexOf('{{') < 0) continue;
      var r = evalHole(val, scope);
      if (typeof r === 'function') { el.removeAttribute(name); el[name.toLowerCase()] = r; }
      else if (ONE.test(val)) el.setAttribute(name, r == null ? '' : String(r));
      else el.setAttribute(name, interp(val, scope));

    var oc = Array.prototype.slice.call(o.childNodes), nc = Array.prototype.slice.call(n.childNodes), i;
